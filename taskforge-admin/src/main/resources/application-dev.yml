server:
  port: 1234
spring:
  application:
    name: taskforge
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 2004
    # MySQL / Redis 在开发机虚拟机上（本机无本地 3306）
    url: jdbc:mysql://192.168.5.16:3306/laigeoffer-pmhub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  data:
    redis:
      host: 192.168.5.16
      port: 6379
      password: 2004
      database: 0
      timeout: 10s
    
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.zhq.taskforge.common.core.domain.entity,com.zhq.taskforge.system.domain,com.zhq.taskforge.project.domain

token:
  header: Authorization
  secret: my-very-long-and-random-secret-key-2026
  expireTime: 30

# 文件上传根目录（Windows 本机；勿用虚拟机 Linux 路径）
taskforge:
  profile: E:/TaskForge/data/uploadPath

# Flowable（对照 pmhub-admin application.yml；生产勿盲目开 schema-update）
flowable:
  async-executor-activate: false
  database-schema-update: true
  idm:
    enabled: false
